# Copy this file to config.yaml and fill in your own values.
# config.yaml is gitignored. Never commit real API keys.

# Name shown in the header and browser tab.
app_name: "Kitsune"

# Accent color for buttons and highlights (any CSS color).
accent_color: "#f97316"

# Persona for the assistant. Change this to brand the behavior.
system_prompt: "You are a helpful assistant."

# Which backend to use: "ollama" (free, local) or "openai_compatible" (paid API).
backend: "ollama"

ollama:
  # Where your local Ollama server listens.
  base_url: "http://localhost:11434"
  # Model name, must be pulled first: ollama pull llama3.1
  model: "llama3.1"

openai_compatible:
  # Works with OpenAI and any OpenAI-compatible endpoint.
  base_url: "https://api.openai.com/v1"
  # Put your key in config.yaml only, never commit it.
  api_key: ""
  model: "gpt-4o-mini"

# Subagents for the /api/subagents endpoint: background workers that each
# get their own system prompt. A task is fanned out to all of them in
# parallel, then the main model merges their answers into one reply.
# Add, remove, or rename these to build your own team.
subagents:
  - name: "researcher"
    system_prompt: "You are a research specialist. Be thorough and factual, key points first."
  - name: "coder"
    system_prompt: "You are a senior Python developer. Write clean, working code with brief explanations."
  - name: "reviewer"
    system_prompt: "You are a careful reviewer. Check answers for mistakes, gaps, and unclear reasoning."

# Smart routing: when true, the app reads each message and automatically
# decides whether it needs a web search, the subagent team, or just a
# normal reply. Set to false to make every message a normal reply
# (the /web and /team commands still work as explicit overrides).
auto_route: true

# SQLite file for conversation history (relative to the project folder).
database: "chat.db"

# Port the web UI listens on.
port: 5000
