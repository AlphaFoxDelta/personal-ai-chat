# Render blueprint: connect this repo as a Web Service and Render pre-fills
# everything below. You only type in the two secrets marked sync: false.
services:
  - type: web
    name: kitsune
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    plan: free
    envVars:
      - key: BACKEND
        value: openai_compatible
      - key: OPENAI_COMPATIBLE_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: APP_NAME
        value: Kitsune
      - key: ACCENT_COLOR
        value: "#f97316"
      - key: AUTO_ROUTE
        value: "true"
      - key: OPENAI_COMPATIBLE_MODEL
        sync: false
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
