<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">My AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-chat" class="new-chat-btn">+ New chat</button>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="sidebar-footer">Runs on your machine. Free with Ollama.</div>
    </aside>
    <main class="main">
      <header class="chat-header">
        <h1 id="app-name">My AI</h1>
      </header>
      <div id="messages" class="messages"></div>
      <div id="error-bar" class="error-bar hidden"></div>
      <form id="chat-form" class="composer">
        <input id="chat-input" type="text" placeholder="Type a message... (try /team or /web)" autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
