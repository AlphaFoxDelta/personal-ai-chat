<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">My AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <button id="new-chat" class="new-chat-btn">+ New chat</button>
      <div id="conversation-list" class="conversation-list"></div>
      <div class="sidebar-footer">Runs on your machine. Free with Ollama.</div>
    </aside>
    <main class="main">
      <header class="chat-header">
        <h1 id="app-name">My AI</h1>
        <button id="panel-toggle" class="panel-toggle" title="Toggle profile panel">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        </button>
      </header>
      <div id="messages" class="messages"></div>
      <div id="error-bar" class="error-bar hidden"></div>
      <form id="chat-form" class="composer">
        <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off">
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
    <aside class="profile-panel" id="profile-panel">
      <div class="profile-avatar-wrap">
        <img id="profile-avatar" src="" alt="Kitsune avatar">
      </div>
      <h2 id="profile-name">Kitsune</h2>
      <div class="profile-status"><span class="status-dot"></span>Online</div>
      <div class="profile-divider"></div>
      <div class="profile-section">
        <button class="profile-section-header" id="avatar-section-toggle">
          <span>Avatar · <span id="avatar-current-name">Ember</span></span>
          <span class="section-chevron" id="avatar-chevron">›</span>
        </button>
        <div id="profile-avatar-grid" class="profile-avatar-grid"></div>
      </div>
      <div class="profile-section activity-section">
        <div class="profile-section-header static">
          <span>Activity</span>
        </div>
        <div id="activity-feed" class="activity-feed"></div>
      </div>
    </aside>
  </div>
  <script src="/static/avatars.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
